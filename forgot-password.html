<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCKA - استعادة كلمة المرور</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-container">
        
        <div class="login-header">
            <div class="small-logo-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M30 45V32C30 20 39 10 50 10C61 10 70 20 70 32V45" fill="none" stroke="#39639E" stroke-width="8" stroke-linecap="round"/>
                    <rect x="20" y="40" width="60" height="48" rx="10" fill="#39639E"/>
                    <circle cx="50" cy="60" r="6" fill="white"/>
                    <rect x="47" y="60" width="6" height="15" rx="3" fill="white"/>
                </svg>
            </div>
            <h2 class="brand-title">LOCKA</h2>
            
            <p class="welcome-text">نسيت كلمة المرور؟</p>
            <p class="welcome-subtext">أدخل رقم جوالك لإرسال رمز التحقق</p>
        </div>

        <form class="login-form" onsubmit="event.preventDefault(); window.location.href='verify-code.html';">
            
            <div class="input-group">
                <div class="input-with-icon">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="#718096" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
                    </span>
                    <input type="tel" placeholder="أدخل رقم الجوال" required>
                </div>
            </div>

            <button type="submit" class="submit-button">إرسال رمز التحقق</button>

            <a href="login.html" class="forgot-link">العودة لتسجيل الدخول</a>

        </form>

    </div>

</body>

</html>
