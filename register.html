<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCKA - إنشاء حساب جديد</title>

    <!-- روابط الخطوط من جوجل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- ربط ملف التصميم الخارجي -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-container">
        
        <!-- رأس الصفحة والشعار -->
        <div class="login-header">
            <div class="small-logo-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M30 45V32C30 20 39 10 50 10C61 10 70 20 70 32V45" fill="none" stroke="#39639E" stroke-width="8" stroke-linecap="round"/>
                    <rect x="20" y="40" width="60" height="48" rx="10" fill="#39639E"/>
                    <circle cx="50" cy="60" r="6" fill="white"/>
                    <rect x="47" y="60" width="6" height="15" rx="3" fill="white"/>
                </svg>
            </div>
            <h2 class="brand-title">LOCKA</h2>
            
            <p class="welcome-text">حساب جديد</p>
            <p class="welcome-subtext">أدخل بياناتك لإنشاء حساب في النظام</p>
        </div>

        <!-- نموذج إنشاء الحساب -->
        <form class="login-form">
            
            <!-- حقل الاسم الكامل -->
            <div class="input-group">
                <div class="input-with-icon">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="#718096" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </span>
                    <input type="text" placeholder="أدخل اسمك الكامل" required>
                </div>
            </div>

            <!-- حقل الرقم الجامعي -->
            <div class="input-group">
                <div class="input-with-icon">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="#718096" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </span>
                    <input type="text" placeholder="أدخل رقمك الجامعي" required>
                </div>
            </div>

            <!-- حقل رقم الجوال -->
            <div class="input-group">
                <div class="input-with-icon">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="#718096" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
                    </span>
                    <input type="tel" placeholder="أدخل رقم الجوال (05xxxxxxxx)" required>
                </div>
            </div>

            <!-- حقل كلمة المرور -->
            <div class="input-group">
                <div class="input-with-icon">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="#718096" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.778-7.778zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
                    </span>
                    <input type="password" placeholder="أدخل كلمة المرور" required>
                </div>
            </div>

            <!-- زر التسجيل -->
            <button type="submit" class="submit-button">إنشاء الحساب</button>

            <!-- رابط العودة لتسجيل الدخول -->
            <p class="register-prompt">
                لديك حساب بالفعل؟ <a href="login.html" class="register-link">تسجيل الدخول</a>
            </p>

        </form>

    </div>

</body>

</html>
